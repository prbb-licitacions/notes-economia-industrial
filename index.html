<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Notes — UdG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-dark: #0F3460;
    --blue-mid: #1B4F8A;
    --blue-light: #E8F0FA;
    --green: #1B7A3E;
    --green-bg: #EAF3DE;
    --green-border: #97C459;
    --amber: #8A5A0A;
    --amber-bg: #FAEEDA;
    --amber-border: #EF9F27;
    --red: #9B2020;
    --red-bg: #FCEBEB;
    --red-border: #F09595;
    --gray-50: #F7F6F3;
    --gray-100: #EDECE8;
    --gray-300: #C4C2BA;
    --gray-500: #888780;
    --gray-700: #444441;
    --gray-900: #1A1A18;
    --radius: 10px;
    --radius-sm: 6px;
  }

  html, body {
    min-height: 100vh;
    background: var(--gray-50);
    font-family: 'DM Sans', sans-serif;
    color: var(--gray-900);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3rem 1rem 4rem;
  }

  .container {
    width: 100%;
    max-width: 420px;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.75rem;
  }
  .logo-mark {
    width: 42px; height: 42px;
    background: var(--blue-mid);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark span {
    color: white;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.5px;
  }
  .logo-text { line-height: 1.3; }
  .logo-title { font-size: 18px; font-weight: 500; color: var(--gray-900); }
  .logo-sub { font-size: 12px; color: var(--gray-500); }

  /* Notice */
  .notice {
    display: flex;
    gap: 10px;
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    margin-bottom: 1.25rem;
  }
  .notice-icon {
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .notice p { font-size: 13px; color: #633806; line-height: 1.55; }
  .notice strong { font-weight: 500; }

  /* Card */
  .card {
    background: white;
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--gray-500);
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    height: 42px;
    padding: 0 12px;
    font-size: 15px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    border: 1px solid var(--gray-300);
    border-radius: var(--radius-sm);
    outline: none;
    color: var(--gray-900);
    background: white;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--blue-mid);
    box-shadow: 0 0 0 3px rgba(27,79,138,0.1);
  }

  button {
    height: 42px;
    padding: 0 1.25rem;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    background: var(--blue-mid);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  button:hover { background: var(--blue-dark); }
  button:active { transform: scale(0.97); }

  /* Results */
  .result-area { margin-top: 1.25rem; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .note-card {
    background: var(--gray-50);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
  }
  .note-label {
    font-size: 11px;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .note-value {
    font-size: 34px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    color: var(--gray-900);
  }
  .note-value.high { color: var(--green); }
  .note-value.mid  { color: var(--amber); }
  .note-value.low  { color: var(--red); }
  .note-value.none { font-size: 22px; color: var(--gray-300); }
  .note-pct {
    font-size: 11px;
    color: var(--gray-500);
    margin-top: 4px;
  }
  .note-badge {
    display: inline-block;
    font-size: 10px;
    background: var(--amber-bg);
    color: #854F0B;
    border-radius: 4px;
    padding: 2px 7px;
    margin-top: 6px;
    font-weight: 500;
  }

  /* Final card */
  .final-card {
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    border: 1px solid var(--gray-100);
    background: var(--gray-50);
  }
  .final-card.ok   { background: var(--green-bg); border-color: var(--green-border); }
  .final-card.warn { background: var(--amber-bg); border-color: var(--amber-border); }
  .final-card.fail { background: var(--red-bg);   border-color: var(--red-border); }

  .final-row { display: flex; align-items: center; justify-content: space-between; }
  .final-label { font-size: 13px; font-weight: 500; color: var(--gray-700); }
  .final-label.ok   { color: #27500A; }
  .final-label.warn { color: #633806; }
  .final-label.fail { color: #791F1F; }

  .final-num { font-size: 30px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .final-num.ok   { color: var(--green); }
  .final-num.warn { color: var(--amber); }
  .final-num.fail { color: var(--red); }

  .final-desc { font-size: 12px; margin-top: 5px; color: var(--gray-500); line-height: 1.5; }
  .final-desc.ok   { color: #3B6D11; }
  .final-desc.warn { color: #854F0B; }
  .final-desc.fail { color: #A32D2D; }

  .student-id {
    font-size: 12px;
    color: var(--gray-300);
    text-align: center;
    margin-top: 10px;
    font-family: 'DM Mono', monospace;
  }

  /* Messages */
  .msg {
    font-size: 14px;
    color: var(--gray-500);
    padding: 0.75rem 1rem;
    background: var(--gray-50);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    text-align: center;
  }
  .msg.error {
    background: var(--red-bg);
    color: var(--red);
    border-color: var(--red-border);
  }

  /* Footer */
  .footer {
    margin-top: 2rem;
    font-size: 12px;
    color: var(--gray-300);
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo-mark"><span>UdG</span></div>
    <div class="logo-text">
      <div class="logo-title">Consulta de notes</div>
      <div class="logo-sub">Economia Industrial — Grup C</div>
    </div>
  </div>

  <div class="notice">
    <span class="notice-icon">⚠️</span>
    <p><strong>Recordatori:</strong> Les notes de l'Examen 1 i l'Examen 2 <strong>no són recuperables</strong>. La nota obtinguda és definitiva i compta un 20% cadascuna sobre la nota final.</p>
  </div>

  <div class="card">
    <label for="codi-input">Escriu el teu codi d'alumne <strong style="color:var(--red)">sense la U al davant</strong></label>
    <div class="input-row">
      <input type="text" id="codi-input" placeholder="p. ex. 6104617" maxlength="10" inputmode="numeric" autocomplete="off" />
      <button onclick="consultar()">Consultar</button>
    </div>
    <div class="result-area" id="result-area"></div>
  </div>

  <div class="footer">Les dades mostrades són només a efectes informatius.</div>
</div>

<script>
const dades = {
  1995933:[90,65],1995924:[68,10],1996378:[49,32],1996671:[73,26],
  6104617:[null,21],6105216:[68,40],1989286:[null,null],6103919:[70,50],
  6105215:[33,78],6105747:[75,35],6105208:[100,70],6103577:[98,75],
  1994057:[null,null],6104869:[13,22],8807275:[73,27],6102702:[45,45],
  6104324:[53,25],1993711:[15,62],1979977:[82,72],6103555:[100,75],
  1987032:[61,null],1993690:[55,30],1994233:[null,null],6104870:[68,52],
  1995272:[75,66],6102307:[45,50],1995253:[63,55],6102342:[78,52],
  6102311:[53,70],1967120:[null,null],1996679:[57,47],6105217:[68,62],
  6104442:[45,30],6102322:[60,46],6102339:[63,null],1989282:[null,null],
  6102295:[58,19],6102290:[null,null],1961081:[68,40],6105210:[68,95],
  1991155:[58,30],1988866:[null,null],1935716:[null,null],1981004:[75,null],
  6102369:[100,90],6102313:[63,61],6105750:[null,null],6115435:[null,null],
  1995366:[98,60],6102348:[48,36],1981102:[18,52],6105214:[43,36],
  1988371:[95,100],6102358:[70,49],6102370:[83,55],6103921:[66,61],
  1993731:[null,null],6102355:[15,42],6102298:[10,44],6102357:[98,100],
  6105206:[100,75],1977712:[null,null],1986618:[null,null],1988369:[73,85],
  1995936:[null,null]
};

function colorClass(v) {
  if (v === null) return 'none';
  if (v >= 70) return 'high';
  if (v >= 50) return 'mid';
  return 'low';
}

function fmt(v) { return v !== null ? v : '—'; }

function consultar() {
  const raw = document.getElementById('codi-input').value.trim();
  const area = document.getElementById('result-area');
  if (!raw) {
    area.innerHTML = '<div class="msg">Introdueix el teu codi d\'alumne.</div>';
    return;
  }
  const id = parseInt(raw);
  if (!(id in dades)) {
    area.innerHTML = '<div class="msg error">Codi no trobat. Comprova el número i torna-ho a intentar.</div>';
    return;
  }

  const [e1, e2] = dades[id];
  const bothNull = e1 === null && e2 === null;
  const parcialAcum = (e1 !== null ? e1 * 0.2 : 0) + (e2 !== null ? e2 * 0.2 : 0);

  let finalHtml = '';
  if (bothNull) {
    finalHtml = `
      <div class="final-card">
        <div class="final-row">
          <span class="final-label">Nota final necessària</span>
          <span class="final-num" style="color:var(--gray-300)">—</span>
        </div>
        <div class="final-desc">Sense notes parcials registrades.</div>
      </div>`;
  } else {
    const needed = (50 - parcialAcum) / 0.6;
    const neededR = Math.round(needed * 10) / 10;
    let cls, label, desc;
    if (needed <= 0) {
      cls = 'ok';
      label = 'Ja aprovat!';
      desc = `Amb ${Math.round(parcialAcum*10)/10} punts acumulats (sobre 40), ja superes el 50. Qualsevol nota al final et valdrà.`;
    } else if (needed > 100) {
      cls = 'fail';
      label = 'Impossible aprovar';
      desc = `Necessitaries més de 100 al final. Amb ${Math.round(parcialAcum*10)/10} punts acumulats no és possible arribar al 50.`;
    } else if (needed >= 70) {
      cls = 'warn';
      label = 'Nota necessària al final';
      desc = `Necessites un mínim de ${neededR} sobre 100 a l'examen final (60% de la nota).`;
    } else {
      cls = 'ok';
      label = 'Nota necessària al final';
      desc = `Necessites un mínim de ${neededR} sobre 100 a l'examen final (60% de la nota).`;
    }
    finalHtml = `
      <div class="final-card ${cls}">
        <div class="final-row">
          <span class="final-label ${cls}">${label}</span>
          ${needed > 0 && needed <= 100 ? `<span class="final-num ${cls}">${neededR}</span>` : ''}
        </div>
        <div class="final-desc ${cls}">${desc}</div>
      </div>`;
  }

  area.innerHTML = `
    <div class="result-grid">
      <div class="note-card">
        <div class="note-label">Examen 1</div>
        <div class="note-value ${colorClass(e1)}">${fmt(e1)}</div>
        <div class="note-pct">20% de la nota</div>
        <div class="note-badge">No recuperable</div>
      </div>
      <div class="note-card">
        <div class="note-label">Examen 2</div>
        <div class="note-value ${colorClass(e2)}">${fmt(e2)}</div>
        <div class="note-pct">20% de la nota</div>
        <div class="note-badge">No recuperable</div>
      </div>
    </div>
    ${finalHtml}
    <div class="student-id">Alumne #${id}</div>
  `;
}

document.getElementById('codi-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') consultar();
});
</script>
</body>
</html>
